name: Build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Resume 1
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: Resume 1

      - name: Compile Resume 2
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: Resume 2
          latexmk_use_xelatex: true

      - name: Show LaTeX errors
        if: failure()
        run: |
          for f in "Resume 1/main.log" "Resume 2/main.log"; do
            [ -f "$f" ] || continue
            msg=$(grep -A4 -m5 '^!' "$f" | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f::$msg"
          done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp "Resume 1/main.pdf" _site/resume-1.pdf
          cp "Resume 2/main.pdf" _site/resume-2.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: _site/*.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.pdf'
          generate_release_notes: true
