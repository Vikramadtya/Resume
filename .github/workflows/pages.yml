name: Deploy Resumes to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for historical commits

      - name: Setup TeX Live
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            xetex
            geometry
            fontspec
            titlesec
            enumitem
            fontawesome
            datetime2
            tracklang
            xkeyval
            datetime2-english
            paracol
            hyperref
            xcolor
            titling
            transparent

      - name: Checkout or Create gh-pages branch
        run: |
          git worktree add gh-pages-branch gh-pages || git worktree add -b gh-pages gh-pages-branch main
          mkdir -p docs/history
          # Copy existing history from gh-pages if it exists
          cp -r gh-pages-branch/history/* docs/history/ 2>/dev/null || true
          cp gh-pages-branch/history.json docs/history.json 2>/dev/null || echo "[]" > docs/history.json

      - name: Compile Current and Historical Commits
        run: |
          # Get the last 15 commits that modified the resumes
          COMMITS=$(git log -n 15 --format="%h|%aI|%s" -- "Resume 1/main.tex" "Resume 2/main.tex")
          
          # Read history.json
          HISTORY_JSON=$(cat docs/history.json)
          
          while IFS='|' read -r HASH DATE MSG; do
            echo "Processing commit $HASH: $MSG"
            
            # Extract historical tex files
            git show $HASH:"Resume 1/main.tex" > "docs/history/resume1-${HASH}.tex" 2>/dev/null || true
            git show $HASH:"Resume 2/main.tex" > "docs/history/resume2-${HASH}.tex" 2>/dev/null || true
            
            # Compile Resume 1 if not exists
            if [ -s "docs/history/resume1-${HASH}.tex" ] && [ ! -f "docs/history/resume1-${HASH}.pdf" ]; then
              echo "Compiling Resume 1 for $HASH..."
              cp "docs/history/resume1-${HASH}.tex" "Resume 1/main.tex"
              (cd "Resume 1" && xelatex -interaction=nonstopmode main.tex > /dev/null 2>&1 || true)
              [ -f "Resume 1/main.pdf" ] && cp "Resume 1/main.pdf" "docs/history/resume1-${HASH}.pdf"
            fi
            
            # Compile Resume 2 if not exists
            if [ -s "docs/history/resume2-${HASH}.tex" ] && [ ! -f "docs/history/resume2-${HASH}.pdf" ]; then
              echo "Compiling Resume 2 for $HASH..."
              cp "docs/history/resume2-${HASH}.tex" "Resume 2/main.tex"
              (cd "Resume 2" && xelatex -interaction=nonstopmode main.tex > /dev/null 2>&1 || true)
              [ -f "Resume 2/main.pdf" ] && cp "Resume 2/main.pdf" "docs/history/resume2-${HASH}.pdf"
            fi
            
            # Add to history.json if not present
            if ! grep -q "\"hash\": \"$HASH\"" docs/history.json; then
              # Sanitize message
              MSG_CLEAN=$(echo "$MSG" | sed 's/"/\\"/g')
              NEW_ENTRY="{\"hash\": \"$HASH\", \"date\": \"$DATE\", \"message\": \"$MSG_CLEAN\"}"
              # Append to JSON array
              if [ "$HISTORY_JSON" = "[]" ] || [ -z "$HISTORY_JSON" ]; then
                HISTORY_JSON="[$NEW_ENTRY]"
              else
                HISTORY_JSON=$(echo "$HISTORY_JSON" | sed "s/]$/,\n$NEW_ENTRY]/")
              fi
            fi
          done <<< "$COMMITS"
          
          echo "$HISTORY_JSON" > docs/history.json
          
          # Restore original main.tex files
          git checkout "Resume 1/main.tex" "Resume 2/main.tex" || true

      - name: Build Frontend
        run: |
          # Copy frontend files to docs
          cp index.html docs/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
